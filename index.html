<title>Faraon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one full-viewport diorama canvas; lapis plaques float in the corners over the sand. */
:root{
  --sand:#E9CD8C;
  --lapis:#15283B;
  --lapis-2:#234462;
  --gold:#EDBE45;
  --papyrus:#F7ECCB;
  --papyrus-dim:#B9C3CC;
  --ink:#4A2E16;
  --font-display:'Marcellus','Palatino Linotype',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sand);color:var(--papyrus);font-family:var(--font-body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
.hud{
  position:absolute;inset:0;pointer-events:none;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;gap:10px;
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.plaque{
  pointer-events:auto;background:var(--lapis);color:var(--papyrus);
  border:1px solid var(--lapis-2);border-bottom:3px solid var(--gold);
  box-shadow:0 6px 18px rgba(74,46,22,.28);
}
.brand{justify-self:start;align-self:start;padding:8px 16px 9px}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);line-height:1.1}
.brand p{margin:2px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--papyrus-dim)}
.tally{justify-self:end;align-self:start;padding:10px 14px;min-width:0;width:min(290px,100%);display:grid;gap:10px}
.tally .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.tally .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--papyrus-dim)}
.tally .val{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tally .bar{grid-column:1/-1;height:5px;background:var(--lapis-2)}
.tally .bar i{display:block;height:100%;width:0;background:var(--gold)}
.tally small{grid-column:1/-1;font-size:11.5px;color:var(--papyrus-dim)}
.dock{grid-column:1/-1;grid-row:3;justify-self:center;display:flex;flex-wrap:wrap;gap:8px 18px;padding:8px 12px;align-items:center;justify-content:center;max-width:100%}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--papyrus-dim);margin-right:4px}
button{
  font:500 13px var(--font-body);color:var(--papyrus);background:var(--lapis-2);
  border:1px solid transparent;padding:6px 11px;cursor:pointer;
}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--gold);color:var(--lapis)}
.hint{grid-column:1/-1;grid-row:2;align-self:end;justify-self:center;margin:0;font-size:12px;color:var(--ink);background:rgba(247,236,203,.72);padding:4px 10px}
@media (max-width:560px){
  .hud{grid-template-columns:1fr}
  .tally{justify-self:start}
  .brand h1{font-size:21px}
}
</style>

<script>
(() => {
'use strict';
/* ============================================================
   ONE WORLD, ONE SCALE
   Unit = one block width (~1.2 m). Everything is defined in these
   units and goes through the single projection P(). Nothing is
   drawn "by eye" in pixels except as a multiple of cam.T.
   Projection: true 2:1 dimetric (camera elevation 30 deg):
     ground diamond is T wide and T/2 tall, one unit of height
     is ZK*T pixels.
   ============================================================ */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W = 800, H = 600, DPR = 1;
const ZK = 0.6124;
const BH = 0.635;            // block height in units (gives the real 51.8 deg slope with half-block insets)
const HUMAN = 1.45;          // a person, in the same units
const cam = { x: 15, y: 1.5, T: 34 };

const P = (x, y, z = 0) => [
  W / 2 + ((x - cam.x) - (y - cam.y)) * cam.T * 0.5,
  H / 2 + ((x - cam.x) + (y - cam.y)) * cam.T * 0.25 - z * cam.T * ZK
];
function unproj(sx, sy, z = 0) {
  const a = (sx - W / 2) / (cam.T * 0.5), b = (sy - H / 2 + z * cam.T * ZK) / (cam.T * 0.25);
  return [cam.x + (a + b) / 2, cam.y + (b - a) / 2];
}
function visBox(z = 0, pad = 2) {
  const c = [unproj(0, 0, z), unproj(W, 0, z), unproj(0, H, z), unproj(W, H, z)];
  return {
    x0: Math.min(c[0][0], c[1][0], c[2][0], c[3][0]) - pad, x1: Math.max(c[0][0], c[1][0], c[2][0], c[3][0]) + pad,
    y0: Math.min(c[0][1], c[1][1], c[2][1], c[3][1]) - pad, y1: Math.max(c[0][1], c[1][1], c[2][1], c[3][1]) + pad
  };
}

/* ---------- small utilities ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hsh(a, b, c = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const shadeCache = new Map();
function shade(hex, amt) {            // amt -1..1 : darker..lighter
  const q = Math.round(amt * 40);
  const key = hex + q;
  let v = shadeCache.get(key);
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const a = q / 40;
  if (a >= 0) { r += (255 - r) * a; g += (255 - g) * a; b += (255 - b) * a; }
  else { r *= 1 + a; g *= 1 + a; b *= 1 + a; }
  v = `rgb(${r | 0},${g | 0},${b | 0})`;
  shadeCache.set(key, v);
  return v;
}
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = lerp(a >> 16, b >> 16, t), g = lerp((a >> 8) & 255, (b >> 8) & 255, t), bl = lerp(a & 255, b & 255, t);
  return `rgb(${r | 0},${g | 0},${bl | 0})`;
}

/* ---------- palette (canvas world) ---------- */
const INK = '#4A2E16';
const C = {
  sand: '#E9CD8C', sandL: '#F2DCA4', sandD: '#D7B670', road: '#D9BB7A', rut: '#C3A261',
  stone: { t: '#FBF2D8', l: '#EBDCB2', r: '#C8B283' },
  raw:   { t: '#E6DABD', l: '#D2C29D', r: '#AF9D76' },
  rock:  { t: '#E2C78F', l: '#F1E6CB', r: '#C9B88F' },
  mud:   { t: '#DDB77E', l: '#C99C60', r: '#A47A44' },
  ramp:  { t: '#CFA36B', l: '#B98A53', r: '#98703F' },
  wood:  { t: '#B98450', l: '#9C6A3A', r: '#7C5229' },
  water: '#3FA9B6', waterD: '#2C8FA3', waterL: '#9ADADB',
  green: '#86B84F', greenD: '#6CA23E', wheat: '#DCC555', damp: '#C7AE66',
  palm: '#3E8E3B', palmD: '#2E7533', trunk: '#8A5A2B',
  skin: '#A9683A', skinD: '#8A522B', kilt: '#FFF8E6', hair: '#2A1B12',
  shadow: 'rgba(96,60,20,0.22)'
};

function path(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function fillPoly(pts, fill) { path(pts); ctx.fillStyle = fill; ctx.fill(); }
function line(a, b) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
const inkW = () => clamp(cam.T / 26, 0.6, 1.5);

/* A box in world units. stroke: 0 none, 1 thin, 2 full ink. */
function box(x, y, z, w, d, h, col, stroke = 2) {
  const A = P(x, y, z + h), B = P(x + w, y, z + h), Cc = P(x + w, y + d, z + h), D = P(x, y + d, z + h);
  const B0 = P(x + w, y, z), C0 = P(x + w, y + d, z), D0 = P(x, y + d, z);
  if (B[0] < -4 || D[0] > W + 4 || C0[1] < -4 || A[1] > H + 4) return;
  fillPoly([A, B, Cc, D], col.t);
  fillPoly([D, Cc, C0, D0], col.l);
  fillPoly([B, Cc, C0, B0], col.r);
  if (!stroke) return;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = INK;
  ctx.globalAlpha = stroke === 2 ? 0.85 : 0.4;
  ctx.lineWidth = stroke === 2 ? inkW() : inkW() * 0.7;
  ctx.beginPath();
  ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(B0[0], B0[1]); ctx.lineTo(C0[0], C0[1]);
  ctx.lineTo(D0[0], D0[1]); ctx.lineTo(D[0], D[1]); ctx.closePath();
  ctx.moveTo(D[0], D[1]); ctx.lineTo(Cc[0], Cc[1]); ctx.lineTo(B[0], B[1]);
  ctx.moveTo(Cc[0], Cc[1]); ctx.lineTo(C0[0], C0[1]);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* ============================================================
   BLOCK STRUCTURES (mastaba, pyramid): courses of blocks, each
   course one block shorter per side and inset by half a block.
   ============================================================ */
function mkStruct(ox, oy, a, b, n) {
  const courses = []; let cum = 0;
  for (let k = 0; k < n; k++) {
    const c = { k, a: a - k, b: b - k, x0: ox + k / 2, y0: oy + k / 2, z: k * BH, start: cum };
    c.cap = c.a * c.b; cum += c.cap; courses.push(c);
  }
  return { ox, oy, a, b, n, courses, total: cum };
}
function courseOf(st, m) {            // index of the course that block number m belongs to (n when finished)
  for (const c of st.courses) if (m < c.start + c.cap) return c.k;
  return st.n;
}
function locate(st, m) {
  const c = st.courses[Math.min(courseOf(st, m), st.n - 1)];
  const r = m - c.start, i = Math.floor(r / c.b), j = r % c.b;
  return { k: c.k, i, j, x: c.x0 + i + 0.5, y: c.y0 + j + 0.5, z: c.z };
}

const MASTABA = mkStruct(0, 0, 12, 8, 4);          // 96 + 77 + 60 + 45 = 278 blocks
const GREAT = mkStruct(-258, -168, 190, 190, 190); // 2 304 415 blocks

function drawGhost(st, strong) {
  const n = st.n, top = st.courses[n - 1], zt = n * BH;
  const x0 = st.ox, y0 = st.oy, x1 = x0 + st.a, y1 = y0 + st.b;
  const tx0 = top.x0, ty0 = top.y0, tx1 = tx0 + top.a, ty1 = ty0 + top.b;
  const b00 = P(x0, y0), b10 = P(x1, y0), b11 = P(x1, y1), b01 = P(x0, y1);
  const t00 = P(tx0, ty0, zt), t10 = P(tx1, ty0, zt), t11 = P(tx1, ty1, zt), t01 = P(tx0, ty1, zt);
  if (b10[0] < 0 || b01[0] > W || b11[1] < 0 || t00[1] > H) return;
  fillPoly([b01, b11, t11, t01], strong ? 'rgba(255,247,222,0.30)' : 'rgba(255,247,222,0.22)');
  fillPoly([b10, b11, t11, t10], strong ? 'rgba(150,108,52,0.16)' : 'rgba(150,108,52,0.12)');
  fillPoly([t00, t10, t11, t01], 'rgba(255,250,232,0.30)');
  ctx.strokeStyle = INK; ctx.lineWidth = strong ? clamp(cam.T / 5, 1, 2) : inkW();
  ctx.setLineDash(strong ? [10, 7] : [5, 4]);
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(b01[0], b01[1]); ctx.lineTo(b11[0], b11[1]); ctx.lineTo(b10[0], b10[1]);
  ctx.lineTo(t10[0], t10[1]); ctx.lineTo(t00[0], t00[1]); ctx.lineTo(t01[0], t01[1]); ctx.closePath();
  ctx.moveTo(b11[0], b11[1]); ctx.lineTo(t11[0], t11[1]);
  ctx.moveTo(t01[0], t01[1]); ctx.lineTo(t11[0], t11[1]); ctx.lineTo(t10[0], t10[1]);
  ctx.stroke();
  ctx.setLineDash([]);
  if (strong) {                                    // faint course lines every 10 courses, to read the height
    ctx.globalAlpha = 0.16; ctx.lineWidth = 1;
    for (let k = 10; k < n; k += 10) {
      const c = st.courses[k];
      line(P(c.x0, c.y0 + c.b, c.z), P(c.x0 + c.a, c.y0 + c.b, c.z));
      line(P(c.x0 + c.a, c.y0, c.z), P(c.x0 + c.a, c.y0 + c.b, c.z));
    }
  }
  ctx.globalAlpha = 1;
}

/* One slab of placed blocks inside a course: columns [i0, i0+w), rows [0, d). */
function slab(st, c, i0, w, d, lod, topOpen, flashIdx, flashT) {
  const x = c.x0 + i0, y = c.y0, z = c.z, h = BH, col = C.stone;
  if (lod < 2) { box(x, y, z, w, d, h, col, lod === 1 ? 1 : 0); return; }
  const vt = visBox(z + h), vb = visBox(z);
  const jw = clamp(cam.T / 40, 0.5, 1);
  ctx.lineWidth = jw; ctx.strokeStyle = 'rgba(74,46,22,0.38)'; ctx.lineJoin = 'round';
  const tone = (i, j) => (hsh(c.k * 7919 + i, j, 3) - 0.5) * 0.11;
  const cell = (pts, fill) => { path(pts); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  // top
  if (topOpen) {
    const ia = Math.max(0, Math.floor(vt.x0 - x)), ib = Math.min(w, Math.ceil(vt.x1 - x));
    const ja = Math.max(0, Math.floor(vt.y0 - y)), jb = Math.min(d, Math.ceil(vt.y1 - y));
    for (let i = ia; i < ib; i++) for (let j = ja; j < jb; j++) {
      const m = c.start + (i0 + i) * c.b + j;
      let t = tone(i0 + i, j);
      if (m === flashIdx) t += 0.5 * flashT;
      cell([P(x + i, y + j, z + h), P(x + i + 1, y + j, z + h), P(x + i + 1, y + j + 1, z + h), P(x + i, y + j + 1, z + h)], shade(col.t, t));
    }
  } else {
    fillPoly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], col.t);
  }
  // left face (+y)
  {
    const ia = Math.max(0, Math.floor(vb.x0 - x)), ib = Math.min(w, Math.ceil(vt.x1 - x));
    for (let i = ia; i < ib; i++)
      cell([P(x + i, y + d, z + h), P(x + i + 1, y + d, z + h), P(x + i + 1, y + d, z), P(x + i, y + d, z)], shade(col.l, tone(i0 + i, d - 1)));
  }
  // right face (+x)
  {
    const ja = Math.max(0, Math.floor(vb.y0 - y)), jb = Math.min(d, Math.ceil(vt.y1 - y));
    for (let j = ja; j < jb; j++)
      cell([P(x + w, y + j, z + h), P(x + w, y + j + 1, z + h), P(x + w, y + j + 1, z), P(x + w, y + j, z)], shade(col.r, tone(i0 + w - 1, j)));
  }
  // firm outline of the slab
  const A = P(x, y, z + h), B = P(x + w, y, z + h), D = P(x, y + d, z + h);
  const B0 = P(x + w, y, z), C0 = P(x + w, y + d, z), D0 = P(x, y + d, z);
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.85; ctx.lineWidth = inkW();
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(B0[0], B0[1]); ctx.lineTo(C0[0], C0[1]);
  ctx.lineTo(D0[0], D0[1]); ctx.lineTo(D[0], D[1]); ctx.closePath(); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawStruct(st, placed, flashIdx, flashT) {
  const cur = courseOf(st, placed);
  const pxH = BH * ZK * cam.T;
  const lod = cam.T >= 13 ? 2 : pxH >= 3 ? 1 : 0;
  for (const c of st.courses) {
    if (placed <= c.start) break;
    const pk = Math.min(c.cap, placed - c.start);
    const I = Math.floor(pk / c.b), J = pk % c.b;
    const topOpen = c.k >= cur - 1;
    if (I > 0) slab(st, c, 0, I, c.b, lod, topOpen, flashIdx, flashT);
    if (J > 0) slab(st, c, I, 1, J, lod, topOpen, flashIdx, flashT);
  }
}

/* ============================================================
   SIMULATION (fixed crew for this study, no player input yet)
   quarry -> pile A -> sledges -> pile B -> masons -> pile C -> ramp -> wall
   ============================================================ */
const PILE_CAP = 18;
const RAMP = { y0: 2.6, y1: 5.4, slope: 8 };
const S = {
  placed: 120, inFlight: 0, pileA: 9, pileB: 7, pileC: 8, qT: 0, rampZ: BH,
  speed: 1, time: 0, depart: { haul: -99, place: -99 }, flashIdx: -1, flashT: 0, stamps: [], rate: 1 / 7.5, done: false
};
const workCourse = () => Math.min(courseOf(MASTABA, S.placed), MASTABA.n - 1);
const rampEdge = () => 12 - Math.max(0, workCourse() - 1) / 2;

function surfaceZ(x, y) {
  const zt = S.rampZ, kc = workCourse();
  if (zt > 0.001) {
    const L = zt * RAMP.slope;
    if (y >= RAMP.y0 - 0.01 && y <= RAMP.y1 + 0.01 && x >= rampEdge() - 0.05 && x <= 12 + L)
      return x <= 12 ? zt : zt * (1 - (x - 12) / L);
  }
  if (kc >= 1) {
    const c = MASTABA.courses[kc - 1];
    if (x >= c.x0 && x <= c.x0 + c.a && y >= c.y0 && y <= c.y0 + c.b) return kc * BH;
  }
  return 0;
}

const ROAD_AB = [[33.6, -35.2], [32.4, -26], [35, -18], [35.6, -13.4]];
function mkTeam(kind, lane) {
  const t = { kind, lane, state: 'wait', path: null, seg: 0, x: 0, y: 0, dir: [1, 0], loaded: false, t: 0, target: null, ph: lane * 1.7 };
  if (kind === 'haul') { t.x = ROAD_AB[0][0] + lane * 1.5; t.y = ROAD_AB[0][1]; t.dir = [0, -1]; }
  else { t.x = 33.2 + lane * 1.7; t.y = 2.4; t.dir = [0, -1]; }
  t.hx = t.x; t.hy = t.y;
  return t;
}
const teams = [mkTeam('haul', -1), mkTeam('haul', 0), mkTeam('haul', 1), mkTeam('place', -1), mkTeam('place', 0), mkTeam('place', 1)];
const masons = [{ x: 33.4, y: -6.2, t: 0, has: true }, { x: 36.0, y: -6.2, t: 6, has: true }, { x: 38.6, y: -6.2, t: 11, has: true }];
const T_QUARRY = 3.0, T_MASON = 14;

function follow(tm, dist) {            // returns true when the path end is reached
  while (dist > 0 && tm.seg < tm.path.length - 1) {
    const b = tm.path[tm.seg + 1];
    const dx = b[0] - tm.x, dy = b[1] - tm.y, d = Math.hypot(dx, dy);
    if (d > 1e-6) tm.dir = [dx / d, dy / d];
    if (d <= dist) { tm.x = b[0]; tm.y = b[1]; tm.seg++; dist -= d; }
    else { tm.x += dx / d * dist; tm.y += dy / d * dist; dist = 0; }
  }
  return tm.seg >= tm.path.length - 1;
}
function go(tm, pts, state) { tm.path = [[tm.x, tm.y], ...pts]; tm.seg = 0; tm.state = state; }

function stepTeam(tm, dt) {

  // broad dune tones
  for (let i = Math.floor(vb.x0 / 46); i <= Math.ceil(vb.x1 / 46); i++) for (let j = Math.floor(vb.y0 / 46); j <= Math.ceil(vb.y1 / 46); j++) {
    const x = i * 46 + hsh(i, j, 31) * 30, y = j * 46 + hsh(i, j, 32) * 30; if (x > 60) continue;
    const r = (16 + hsh(i, j, 33) * 18) * cam.T * 0.7, [sx, sy] = P(x, y);
    if (sx + r < 0 || sx - r > W || sy + r * 0.5 < 0 || sy - r * 0.5 > H) continue;
    const lightTone = hsh(i, j, 34) > 0.5;
    ctx.save(); ctx.translate(sx, sy); ctx.scale(1, 0.5);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    gr.addColorStop(0, lightTone ? 'rgba(246,228,176,0.5)' : 'rgba(206,170,98,0.34)');
    gr.addColorStop(1, lightTone ? 'rgba(246,228,176,0)' : 'rgba(206,170,98,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.restore();
  }
  // levelled bedrock where the Great Pyramid will stand
  const g = GREAT, gp = [P(g.ox - 6, g.oy - 6), P(g.ox + 196, g.oy - 6), P(g.ox + 196, g.oy + 196), P(g.ox - 6, g.oy + 196)];
  fillPoly(gp, 'rgba(250,236,196,0.55)');
  ctx.strokeStyle = 'rgba(74,46,22,0.35)'; ctx.lineWidth = 1; path(gp); ctx.stroke();
  // river plain
  if (vb.x1 > 62) {
    const ys = []; for (let y = Math.floor(vb.y0 / 6) * 6; y <= vb.y1 + 6; y += 6) ys.push(y);
    const band = (fa, fb, fill) => { const p = ys.map(y => P(fa(y), y)).concat(ys.slice().reverse().map(y => P(fb(y), y))); fillPoly(p, fill); };
    const gl = y => nileL(y) - 27 + 1.5 * Math.sin(y / 9);
    band(y => gl(y) - 1.6, nileL, C.damp);
    band(gl, nileL, C.green);
    band(nileR, y => nileR(y) + 25 + 2 * Math.sin(y / 13), C.green);
    // field plots
    for (let j = Math.floor(vb.y0 / 9); j <= Math.ceil(vb.y1 / 9); j++) for (let c = 0; c < 2; c++) {
      const x0 = c ? 80.4 : 71.4, x1 = c ? 87.4 : 78.9, y0 = j * 9, y1 = y0 + 8.1, k = hsh(j, c, 41);
      const col = k < 0.34 ? C.wheat : k < 0.7 ? C.greenD : '#9CCB5E';
      const p = [P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1)]; fillPoly(p, col);
      if (cam.T >= 7) {
        ctx.strokeStyle = 'rgba(74,46,22,0.18)'; ctx.lineWidth = 1;
        for (let x = x0 + 0.9; x < x1; x += 0.9) line(P(x, y0), P(x, y1));
        ctx.strokeStyle = 'rgba(74,46,22,0.5)'; ctx.lineWidth = inkW() * 0.8; path(p); ctx.stroke();
      }
    }
    band(nileL, nileR, C.water);
    band(y => nileL(y) + 9, y => nileR(y) - 9, C.waterD);
    ctx.strokeStyle = 'rgba(74,46,22,0.45)'; ctx.lineWidth = inkW();
    ctx.beginPath(); ys.forEach((y, i) => { const p = P(nileL(y), y); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke();
    ctx.beginPath(); ys.forEach((y, i) => { const p = P(nileR(y), y); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke();
    if (cam.T >= 5) {                                               // ripples drifting north
      ctx.strokeStyle = C.waterL; ctx.lineWidth = clamp(cam.T * 0.07, 0.8, 2.5); ctx.lineCap = 'round';
      for (let j = Math.floor(vb.y0 / 7); j <= Math.ceil(vb.y1 / 7); j++) for (let c = 0; c < 5; c++) {
        if (hsh(j, c, 51) > 0.55) continue;
        const y = j * 7 + hsh(j, c, 52) * 7 - ((now * 0.0012 + hsh(j, c, 55)) % 1) * 3;
        const x = nileL(y) + 3 + c * 7 + hsh(j, c, 53) * 4, len = 1.5 + hsh(j, c, 54) * 2;
        line(P(x, y), P(x, y + len));
      }
    }
    // two river boats
    for (let b = 0; b < 2; b++) {
      const y = ((now * 0.0016 * (b ? -1 : 1.4) + b * 170) % 360 + 360) % 360 - 180, x = nileL(y) + (b ? 13 : 26);
      const [sx, sy] = P(x, y), u = cam.T;
      if (u < 2.5 || sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
      ctx.fillStyle = C.wood.l; ctx.strokeStyle = INK; ctx.lineWidth = inkW();
      ctx.beginPath(); ctx.moveTo(sx - 2.4 * u, sy - 0.5 * u); ctx.quadraticCurveTo(sx, sy + 1.3 * u, sx + 2.4 * u, sy - 0.5 * u); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = C.wood.r; ctx.lineWidth = Math.max(1, u * 0.12); line([sx, sy], [sx, sy - 3.2 * u]);
      ctx.fillStyle = '#FBF2D8'; ctx.strokeStyle = INK; ctx.lineWidth = inkW();
      path([[sx - 1.5 * u, sy - 3.1 * u], [sx + 1.5 * u, sy - 3.1 * u], [sx + 1.2 * u, sy - 1.2 * u], [sx - 1.2 * u, sy - 1.2 * u]]); ctx.fill(); ctx.stroke();
    }
  }
  // roads
  for (const r of ROADS) fillPoly(strip(r.pts, r.half), 'rgba(203,170,102,0.5)');
  if (cam.T >= 9) {
    ctx.strokeStyle = C.rut; ctx.lineWidth = clamp(cam.T * 0.06, 0.8, 2.4); ctx.lineCap = 'round';
    for (const r of ROADS.slice(0, 2)) for (const off of [-0.9, 0.9]) {
      ctx.beginPath(); r.pts.forEach((p, i) => { const q = P(p[0] + off, p[1] + off * 0.3); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke();
    }
  }
  // sand ripples and stones, only when close enough to matter
  if (cam.T >= 11) {
    const v = visBox(0, 4); ctx.lineCap = 'round';
    for (let i = Math.floor(v.x0 / 4); i <= Math.ceil(Math.min(v.x1, 66) / 4); i++) for (let j = Math.floor(v.y0 / 4); j <= Math.ceil(v.y1 / 4); j++) {
      const k = hsh(i, j, 61), x = i * 4 + hsh(i, j, 62) * 3, y = j * 4 + hsh(i, j, 63) * 3;
      if (x > -3 && x < 30 && y > -3 && y < 11) continue;
      const [sx, sy] = P(x, y), u = cam.T;
      if (k < 0.3) {
        ctx.strokeStyle = k < 0.15 ? 'rgba(196,160,92,0.75)' : 'rgba(247,230,180,0.9)'; ctx.lineWidth = clamp(u * 0.05, 0.8, 2);
        ctx.beginPath(); ctx.moveTo(sx - u * 0.7, sy); ctx.quadraticCurveTo(sx, sy - u * 0.16, sx + u * 0.7, sy); ctx.stroke();
      } else if (k > 0.94) {
        ctx.fillStyle = C.rock.r; ctx.beginPath(); ctx.ellipse(sx, sy, u * 0.22, u * 0.12, 0, 0, 7); ctx.fill();
        ctx.fillStyle = C.rock.t; ctx.beginPath(); ctx.ellipse(sx - u * 0.04, sy - u * 0.05, u * 0.16, u * 0.08, 0, 0, 7); ctx.fill();
      }
    }
  }
  // shadows on the ground
  for (const s of statics) {
    if (s.shadow) groundShadow(s.x0, s.y0, s.x1, s.y1, s.h);
    else if (s.palm && cam.T >= 5) {
      const p = s.palm, [sx, sy] = P(p.x + 0.8 * p.h * 0.45, p.y - 0.35 * p.h * 0.45);
      ctx.fillStyle = C.shadow; ctx.beginPath(); ctx.ellipse(sx, sy, cam.T * 1.7, cam.T * 0.6, 0, 0, 7); ctx.fill();
    }
  }
  const cur = courseOf(MASTABA, S.placed);
  if (S.placed > 0) {
    const c = MASTABA.courses[Math.max(0, Math.min(cur, MASTABA.n - 1) - (cur >= MASTABA.n ? 0 : 1))] || MASTABA.courses[0];
    const hz = (c.k + 1) * BH;
    groundShadow(0, 0, 12, 8, hz, c.x0, c.y0, c.x0 + c.a, c.y0 + c.b);
  }
  if (S.rampZ > 0.01) {
    const L = S.rampZ * RAMP.slope, ox = 0.8 * S.rampZ, oy = -0.35 * S.rampZ;
    fillPoly([P(12, RAMP.y0), P(12 + ox, RAMP.y0 + oy), P(12 + L, RAMP.y0)], C.shadow);
  }
}

/* ============================================================
   MOVERS: collected every frame, slotted between the statics
   ============================================================ */
function collectMovers(now) {
  const items = [];
  const t = S.time;
  // quarrymen: they stop when their pile is full, which is the whole point of buffers
  const qBusy = S.pileA < PILE_CAP;
  [[20.6, -40.9, 0], [23.6, -41, 0], [26.6, -40.9, 0], [29.4, -41, 0], [24.5, -44.4, 1.3], [31.5, -44.5, 1.3]].forEach(([x, y, z], i) =>
    items.push({ x, y, draw() { worker(x, y, z, { face: 1, anim: qBusy ? 'chip' : 'idle', ph: t * 6 + i * 1.3 }); } }));
  // masons with the block they are dressing
  masons.forEach((m, i) => {
    if (m.has) {
      const k = clamp(m.t / T_MASON, 0, 1);
      const col = { t: mix(C.raw.t, C.stone.t, k), l: mix(C.raw.l, C.stone.l, k), r: mix(C.raw.r, C.stone.r, k) };
      items.push({ x: m.x, y: m.y, draw() { box(m.x - 0.5, m.y - 0.5, 0, 1, 1, BH, col, cam.T >= 9 ? 2 : 1); } });
    }
    items.push({ x: m.x + 0.2, y: m.y + 1.0, draw() { worker(m.x - 0.1, m.y + 0.95, 0, { face: 1, anim: m.has && m.t < T_MASON ? 'carve' : 'idle', ph: t * 6 + i * 2.1 }); } });
  });
  // sledge teams
  for (const tm of teams) {
    const moving = tm.state === 'go' || tm.state === 'back';
    const d = tm.dir, z = surfaceZ(tm.x, tm.y), face = faceOf(d);
    const placing = tm.kind === 'place' && tm.state === 'place';
    const pull = [];
    for (let r = 0; r < 2; r++) for (const s of [-0.42, 0.42]) {
      let px, py;
      if (placing || !moving) { px = tm.x + s * 2.2; py = tm.y + (r ? 1.1 : -1.1); }
      else { const ahead = 1.5 + r * 0.95; px = tm.x + d[0] * ahead - d[1] * s; py = tm.y + d[1] * ahead + d[0] * s; }
      pull.push([px, py, surfaceZ(px, py)]);
    }
    items.push({
      x: tm.x, y: tm.y, draw() {
        box(tm.x - 0.8, tm.y - 0.5, z, 1.6, 1.0, 0.14, C.wood, cam.T >= 9 ? 2 : 0);
        if (tm.loaded && !placing) box(tm.x - 0.5, tm.y - 0.5, z + 0.14, 1, 1, BH, tm.kind === 'haul' ? C.raw : C.stone, cam.T >= 9 ? 2 : 1);
        if (moving && cam.T >= 7) {
          ctx.strokeStyle = '#7A5A32'; ctx.lineWidth = clamp(cam.T * 0.03, 0.6, 1.4);
          const f = P(tm.x + d[0] * 0.8, tm.y + d[1] * 0.8, z + 0.2);
          for (const p of pull) line(f, P(p[0], p[1], p[2] + 0.75));
        }
      }
    });
    pull.forEach((p, i) => items.push({
      x: p[0], y: p[1], draw() {
        const anim = placing ? 'carve' : moving ? (tm.loaded ? 'pull' : 'walk') : 'idle';
        worker(p[0], p[1], p[2], { face: placing ? (p[0] > tm.x ? -1 : 1) : face, anim, ph: tm.ph + i * 1.9 });
      }
    }));
    if (placing) {                                                  // the block slides off the sledge into its place
      const k = clamp(tm.t / 1.5, 0, 1), e = k * k * (3 - 2 * k), tg = tm.target;
      const bx = lerp(tm.from[0], tg.x, e), by = lerp(tm.from[1], tg.y, e), bz = lerp(surfaceZ(tm.from[0], tm.from[1]) + 0.14, tg.z, e);
      items.push({ x: bx, y: by, draw() { box(bx - 0.5, by - 0.5, bz, 1, 1, BH, C.stone, 2); } });
    }
  }
  // slot: draw just before the first static this mover stands behind (and could be hidden by)
  for (const it of items) {
    it.slot = statics.length;
    const sxw = it.x - it.y;
    for (let i = 0; i < statics.length; i++) {
      const b = statics[i];
      if (sxw < b.x0 - b.y1 - 3 || sxw > b.x1 - b.y0 + 3) continue;
      const inFront = it.x >= b.x1 || it.y >= b.y1 || (it.x >= b.x0 && it.y >= b.y0);
      if (!inFront) { it.slot = i; break; }
    }
  }
  items.sort((a, b) => a.slot - b.slot || (a.x + a.y) - (b.x + b.y));
  return items;
}

/* ============================================================
   FRAME
   ============================================================ */
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function label(txt, sub, x, y, z, size) {
  const [sx, sy] = P(x, y, z);
  ctx.textAlign = 'center';
  ctx.font = `${size}px Marcellus, Georgia, serif`;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(247,236,203,0.85)'; ctx.fillStyle = INK; ctx.lineJoin = 'round';
  ctx.strokeText(txt, sx, sy); ctx.fillText(txt, sx, sy);
  if (sub) { ctx.font = `500 ${Math.round(size * 0.62)}px Inter, system-ui, sans-serif`; ctx.strokeText(sub, sx, sy + size * 0.95); ctx.fillText(sub, sx, sy + size * 0.95); }
}
function render(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawGround(now);
  const items = collectMovers(now);
  let m = 0;
  const lo = P(0, 0)[0];
  for (let i = 0; i < statics.length; i++) {
    while (m < items.length && items[m].slot === i) items[m++].draw();
    const s = statics[i];
    const sl = W / 2 + ((s.x0 - cam.x) - (s.y1 - cam.y)) * cam.T * 0.5, sr = W / 2 + ((s.x1 - cam.x) - (s.y0 - cam.y)) * cam.T * 0.5;
    if (sr < -80 || sl > W + 80) continue;
    s.draw();
  }
  while (m < items.length) items[m++].draw();
  // labels
  if (cam.T < 9) {
    const sz = clamp(cam.T * 4.2, 15, 26);
    label('Wielka Piramida', `0 / ${fmt(GREAT.total)} bloków`, GREAT.ox + 95, GREAT.oy + 95, 190 * BH + 8, sz);
    if (cam.T < 6.5) label('Mastaba', `${S.placed} / ${MASTABA.total}`, 6, 4, 9, clamp(cam.T * 3, 12, 17));
  } else if (cam.T < 24) {
    const sz = clamp(cam.T * 1.1, 12, 17);
    label('Kamieniołom', null, 28, -58, 10.5, sz);
    label('Plac kamieniarzy', null, 36, -6, 5, sz);
    label('Wioska robotników', null, 58, 6, 7, sz);
  }
}

let camAnim = null;
function flyTo(to, dur) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { Object.assign(cam, to); camAnim = null; return; }
  camAnim = { from: { ...cam }, to, t: 0, dur };
}
const views = {
  site: () => ({ x: 19, y: -2, T: clamp(Math.min(W / 40, H / 22), 12, 46) }),
  valley: () => ({ x: 40, y: -12, T: clamp(Math.min(W / 125, H / 66), 4, 16) }),
  great: () => ({ x: -156, y: -74, T: clamp(Math.min(W / 235, H / 190), 1.4, 9) })
};

let last = 0, hudT = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (camAnim) {
    camAnim.t += real / camAnim.dur;
    const k = clamp(camAnim.t, 0, 1), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.x = lerp(camAnim.from.x, camAnim.to.x, e); cam.y = lerp(camAnim.from.y, camAnim.to.y, e);
    cam.T = Math.exp(lerp(Math.log(camAnim.from.T), Math.log(camAnim.to.T), e));
    if (k >= 1) camAnim = null;
  }
  const n = Math.max(1, Math.round(S.speed));
  for (let i = 0; i < n; i++) step(real * S.speed / n);
  render(now);
  hudT += real;
  if (hudT > 0.2) { hudT = 0; hud(); }
  requestAnimationFrame(frame);
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
function hud() {
  $('vM').textContent = `${S.placed} / ${MASTABA.total}`;
  $('bM').style.width = (100 * S.placed / MASTABA.total).toFixed(1) + '%';
  const days = GREAT.total / S.rate / 86400;
  $('eta').textContent = S.done ? 'mastaba gotowa, ekipy czekają na nowy projekt' : `w tym tempie: około ${fmt(days)} dni ciągłej pracy`;
}
function onDone() { $('again').hidden = false; }
function setSpeed(v) { S.speed = v; for (const [id, s] of [['s1', 1], ['s4', 4], ['s16', 16]]) $(id).setAttribute('aria-pressed', String(s === v)); }
$('s1').onclick = () => setSpeed(1); $('s4').onclick = () => setSpeed(4); $('s16').onclick = () => setSpeed(16);
$('vSite').onclick = () => flyTo(views.site(), 1.6);
$('vValley').onclick = () => flyTo(views.valley(), 1.6);
$('vGreat').onclick = () => flyTo(views.great(), 2.2);
$('again').onclick = () => {
  Object.assign(S, { placed: 0, inFlight: 0, rampZ: 0, done: false, flashIdx: -1, stamps: [] });
  for (const tm of teams) { tm.state = 'wait'; tm.loaded = false; tm.x = tm.hx; tm.y = tm.hy; }
  $('again').hidden = true;
};

/* ---------- camera input ---------- */
const ptrs = new Map(); let pinch = 0;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); camAnim = null; cv.classList.add('drag'); $('hint').hidden = true; });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
  if (ptrs.size === 1) {
    const a = dx / (cam.T * 0.5), b = dy / (cam.T * 0.25);
    cam.x -= (a + b) / 2; cam.y -= (b - a) / 2;
  } else if (ptrs.size === 2) {
    const [q, r] = [...ptrs.values()], d = Math.hypot(q[0] - r[0], q[1] - r[1]);
    if (pinch) zoomAt((q[0] + r[0]) / 2, (q[1] + r[1]) / 2, d / pinch);
    pinch = d;
  }
});
const up = e => { ptrs.delete(e.pointerId); pinch = 0; if (!ptrs.size) cv.classList.remove('drag'); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function zoomAt(cx, cy, f) {
  const r = cv.getBoundingClientRect(), sx = cx - r.left, sy = cy - r.top;
  const before = unproj(sx, sy);
  cam.T = clamp(cam.T * f, 1.4, 72);
  const after = unproj(sx, sy);
  cam.x += before[0] - after[0]; cam.y += before[1] - after[1];
}
cv.addEventListener('wheel', e => { e.preventDefault(); camAnim = null; $('hint').hidden = true; zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0014)); }, { passive: false });

function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(50, r.width); H = Math.max(50, r.height); DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
addEventListener('resize', resize);

function start(data) {
  resize();
  if (data && typeof data.placed === 'number') {
    S.placed = clamp(data.placed, 0, MASTABA.total); S.rampZ = workCourse() * BH; S.done = S.placed >= MASTABA.total;
    if (S.done) onDone();
    if (data.cam) Object.assign(cam, data.cam);
  } else {
    // open on the thesis: the whole plateau, with the mastaba as a speck beside what is to come
    Object.assign(cam, views.great());
    setTimeout(() => { if (!ptrs.size && !camAnim) flyTo(views.site(), 3.2); }, 2200);
  }
  hud();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ placed: S.placed, cam: { ...cam } }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
window.__faraon = { S, cam, views, flyTo };
})();
</script>
